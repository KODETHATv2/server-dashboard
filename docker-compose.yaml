# Deployed via Coolify (Docker Compose build pack). Set the domain in Coolify as
# http://health.kodethat.com:3000 — Coolify adds the Traefik labels and network itself.
services:
  server-dashboard:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      # Read-only host views so the dashboard reports the host, not the container.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /etc/os-release:/host/os-release:ro
